interface_code: "COAG"

handler: astm

server:
  host: 0.0.0.0
  port: 20200

frame:
  size: 240
  validate_checksum: false

delimiters:
  field: "|"
  component: "^"
  repeat: "\\"
  escape: "&"
  record: "\r"

query:
  barcode_field_indexes: [2, 3]
  allow_component_split: true

response:
  include_patient: true
  send_empty_on_missing: true

translation:
  tests:
    - lis_code: "PT"
      instrument_code: "0001"
    - lis_code: "PTT"
      instrument_code: "0002"
    - lis_code: "FIB"
      instrument_code: "0003"
