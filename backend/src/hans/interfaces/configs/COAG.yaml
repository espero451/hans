interface_code: "COAG"

handler: astm

server:
  host: 0.0.0.0
  port: 20200

frame:
  size: 240
  validate_checksum: false

delimiters:
  field: "|"
  component: "^"
  repeat: "\\"
  escape: "&"
  record: "\r"

response:
  include_patient: true
  send_empty_on_missing: true

astm_mapping:
  query:
    record: "Q"
    barcode_field: 2
    component_last: true

  order_in:
    record: "O"
    specimen_field: 2
    tests_field: 4
    split: "repeat"

  order_out:
    record: "O"
    tests_field: 4
    join: "repeat"

  result:
    record: "R"
    test_code_field: 2
    value_field: 3
    units_field: 4
    flags_fields: 6
    status_fields: 8

  patient_in:
    record: "P"
    first_name_field: 6
    last_name_field: 5
    dob_field: 7

  patient_out:
    record: "P"
    first_name_field: 6
    last_name_field: 5
    dob_field: 7

translation:
  tests:
    - lis_code: "PT"
      instrument_code: "0001"
    - lis_code: "PTT"
      instrument_code: "0002"
    - lis_code: "FIB"
      instrument_code: "0003"
