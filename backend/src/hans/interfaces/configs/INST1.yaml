# Interface identifier used in logs and trace paths.
interface_code: "INST1"

# Module name used to import the interface handler (`hans.interfaces.handlers.astm`).
handler: astm

server:
  host: 0.0.0.0
  port: 20100

# Outbound ASTM responses are framed to `size` bytes; checksum validation is enabled/disabled.
frame:
  size: 240
  validate_checksum: false

# Record/field/component separators used to parse incoming messages and build responses.
delimiters:
  field: "|"
  component: "^"
  repeat: "\\"
  escape: "&"
  record: "\r"

# How barcode is extracted from Q records (field indexes + component splitting).
query:

  # List of ASTM record field indices where to find the barcode. The indices are numbered
  # starting from zero (in AstmRecord.get()), that is:
  # 0 - record type (Q, O, R, etc.)
  # 1 - the first field after the type
  # 2 and 3 - the third and fourth fields of the record
  barcode_field_indexes: [2, 3]

  # If allow_component_split=true, the value can also be split by the component separator
  # (for example ^), and the last part is taken.
  allow_component_split: false

# Controls whether patient P records are included; `send_empty_on_missing`
# (not used by the ASTM handler yet)
response:
  include_patient: true
  send_empty_on_missing: true

### TRANSLATION TABLE:

# Maps LIS test codes to instrument-specific codes and back.
# Each item in 'tests' creates one bidirectional code mapping.
translation:
  tests:
    - lis_code: "GLU"
      instrument_code: "0001"
    - lis_code: "CHOL"
      instrument_code: "0002"
    - lis_code: "CBC"
      instrument_code: "0003"
