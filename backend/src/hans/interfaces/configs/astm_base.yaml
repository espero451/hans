interface_name: astm_base
mode: query

handler: astm

server:
  host: 127.0.0.1
  port: 5100

frame:
  size: 240
  validate_checksum: false

delimiters:
  field: "|"
  component: "^"
  repeat: "\\"
  escape: "&"
  record: "\r"

query:
  barcode_field_indexes: [2, 3]
  allow_component_split: true

response:
  include_patient: true
  send_empty_on_missing: true

translation:
  tests:
    - lis_code: "GLU"
      instrument_code: "0001"
    - lis_code: "BUN"
      instrument_code: "0002"
    - lis_code: "HEM"
      instrument_code: "0003"
    - lis_code: "PPT"
      instrument_code: "0004"

trace_dir: "../prod/instruments"
